name: Verify web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyBSMJjuE7Ejuan0Kmg6soqmRgEQwS4AjJA
      VITE_FIREBASE_AUTH_DOMAIN: clycling-community.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: clycling-community
      VITE_FIREBASE_STORAGE_BUCKET: clycling-community.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "580065543389"
      VITE_FIREBASE_APP_ID: "1:580065543389:web:605515b644dfc906334734"
      VITE_FIREBASE_MEASUREMENT_ID: G-DKQ7MJLM2N
      VITE_FIREBASE_VAPID_KEY: "${{ secrets.VITE_FIREBASE_VAPID_KEY }}"
      VITE_KAKAO_MAP_KEY: e6616e69fe063df85af9079a17df2906
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
