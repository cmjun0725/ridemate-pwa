name: Deploy web app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyBSMJjuE7Ejuan0Kmg6soqmRgEQwS4AjJA
      VITE_FIREBASE_AUTH_DOMAIN: clycling-community.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: clycling-community
      VITE_FIREBASE_STORAGE_BUCKET: clycling-community.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "580065543389"
      VITE_FIREBASE_APP_ID: "1:580065543389:web:605515b644dfc906334734"
      VITE_FIREBASE_MEASUREMENT_ID: G-DKQ7MJLM2N
      VITE_KAKAO_MAP_KEY: e6616e69fe063df85af9079a17df2906
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
